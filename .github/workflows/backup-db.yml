# ═══════════════════════════════════════════════════════════════════
# .github/workflows/backup-db.yml
# ─────────────────────────────────────────────────────────────────
# প্রতিদিন রাত ১১:৪৫ (BD সময়) Realtime Database backup করে নিজের Google
# Drive-এ upload করে।
# Upload হয় নিজের Google account (OAuth) দিয়ে — service account দিয়ে না,
# কারণ personal Gmail-এ service account সরাসরি ফাইল আপলোড করতে পারে না।
#
# লাগবে এই GitHub Secrets (setup ধাপ চ্যাটে দেওয়া আছে):
#   FIREBASE_SERVICE_ACCOUNT   (আগে থেকেই আছে)
#   DRIVE_FOLDER_ID            (আগে থেকেই আছে)
#   GOOGLE_CLIENT_ID           (নতুন)
#   GOOGLE_CLIENT_SECRET       (নতুন)
#   GOOGLE_REFRESH_TOKEN       (নতুন)
#
# Bangladesh = UTC+6 → প্রতিদিন রাত ১১:৪৫ BD = একই দিন UTC 17:45
# ═══════════════════════════════════════════════════════════════════

name: Daily Database Backup

on:
  schedule:
    - cron: '45 17 * * *'   # প্রতিদিন রাত ১১:৪৫ (BD সময়)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin @firebase/app googleapis

      - name: Export database and upload to Drive
        run: node .github/workflows/backup_db.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
