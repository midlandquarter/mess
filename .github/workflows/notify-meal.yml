name: Daily Meal Reminder (রাত ৮টা)

on:
  # GitHub Actions tab থেকে manually trigger করার জন্য
  workflow_dispatch:

jobs:
  send-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Send meal reminder notification
        run: |
          node .github/workflows/send_fcm.js \
            "🍽️ মিল আপডেট করেছেন কি❓❓❓" \
            "আগামী দিনের মিল এখনো update করা না হলে, এখনই update করুন! রাত ১০ টার পরে মিল চালু বা বন্ধ করা যাবে না, নির্ধারিত সময়ের মধ্যে মিল আপডেট করুন"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
