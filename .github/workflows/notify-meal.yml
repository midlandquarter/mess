# .github/workflows/notify-meal.yml
# cron-job.org থেকে workflow_dispatch-এ trigger হয়
# GitHub-এর নিজের cron বাদ দেওয়া হয়েছে (delay হতো)

name: Daily Meal Reminder (রাত ৮টা)

on:
  workflow_dispatch:

jobs:
  send-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Send notification
        run: node .github/workflows/send_fcm.js "মিল আপডেট করুন" "আগামী দিনের মিল আপডেট করতে ভুলে গেলে, অনুগ্রহ করে রাত ১০:০০টার মধ্যে আপডেট করুন।"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          
